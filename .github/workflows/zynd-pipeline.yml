# One ZYND pipeline. Stages run in order:
# 1. Change detection
# 2. Security and quality
# 3. Validation of the areas that changed
# 4. Bluehost VPS backend deployment, only after the earlier stages succeed
#
# Frontend apps stay on Vercel. This pipeline never deploys them.
# Alembic is not invoked here. A development API still migrates on its own startup.

name: ZYND • Pipeline

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('zynd-pipeline-{0}', github.ref) || 'zynd-production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: "Stage 1 • Change detection"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      web_changed: ${{ steps.classify.outputs.web_changed }}
      admin_changed: ${{ steps.classify.outputs.admin_changed }}
      distributor_changed: ${{ steps.classify.outputs.distributor_changed }}
      support_changed: ${{ steps.classify.outputs.support_changed }}
      shared_changed: ${{ steps.classify.outputs.shared_changed }}
      infrastructure_changed: ${{ steps.classify.outputs.infrastructure_changed }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
      documentation_changed: ${{ steps.classify.outputs.documentation_changed }}
      deploy_backend: ${{ steps.classify.outputs.deploy_backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Collect changed paths
        id: files
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP}/zynd-changed.txt"
          event_name="${{ github.event_name }}"
          if [ "${event_name}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "${list}"
          elif [ "${event_name}" = "schedule" ]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              git diff --name-only HEAD~1 HEAD > "${list}"
            else
              git diff-tree --no-commit-id --name-only -r HEAD > "${list}"
            fi
          elif [ "${event_name}" = "workflow_dispatch" ]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              git diff --name-only HEAD~1 HEAD > "${list}"
            else
              git diff-tree --no-commit-id --name-only -r HEAD > "${list}"
            fi
          else
            before="${{ github.event.before }}"
            if [ "${before}" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" > "${list}"
            else
              git diff --name-only "${before}" "${{ github.sha }}" > "${list}"
            fi
          fi
          echo "list=${list}" >> "${GITHUB_OUTPUT}"

      - name: Classify changes
        id: classify
        run: |
          set -euo pipefail
          bash .github/scripts/zynd-classify-changes.sh "${{ steps.files.outputs.list }}" >> "${GITHUB_OUTPUT}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy_backend=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish change summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BACKEND: ${{ steps.classify.outputs.backend_changed }}
          WEB: ${{ steps.classify.outputs.web_changed }}
          ADMIN: ${{ steps.classify.outputs.admin_changed }}
          DISTRIBUTOR: ${{ steps.classify.outputs.distributor_changed }}
          SUPPORT: ${{ steps.classify.outputs.support_changed }}
          MOBILE: ${{ steps.classify.outputs.mobile_changed }}
          SHARED: ${{ steps.classify.outputs.shared_changed }}
          INFRA: ${{ steps.classify.outputs.infrastructure_changed }}
          WORKFLOW: ${{ steps.classify.outputs.workflow_changed }}
          DOCS: ${{ steps.classify.outputs.documentation_changed }}
          DEPLOY: ${{ steps.classify.outputs.deploy_backend }}
        run: |
          set -euo pipefail
          mark() {
            if [ "$1" = "true" ]; then
              printf 'CHANGED'
            else
              printf 'unchanged'
            fi
          }
          if [ "${DEPLOY}" = "true" ]; then
            decision="BACKEND DEPLOYMENT REQUIRED"
          else
            decision="BACKEND DEPLOYMENT NOT REQUIRED"
          fi
          short="${SHA:0:7}"
          {
            echo "# Stage 1 • Change detection"
            echo ""
            echo '```'
            echo "ZYND CHANGE DETECTION"
            echo "====================="
            echo ""
            echo "Commit: ${short}"
            echo "Branch: ${BRANCH}"
            echo ""
            echo "Backend:        $(mark "${BACKEND}")"
            echo "Customer Web:   $(mark "${WEB}")"
            echo "Admin:          $(mark "${ADMIN}")"
            echo "Distributor:    $(mark "${DISTRIBUTOR}")"
            echo "Support:        $(mark "${SUPPORT}")"
            echo "Mobile:         $(mark "${MOBILE}")"
            echo "Shared package: $(mark "${SHARED}")"
            echo "Infrastructure: $(mark "${INFRA}")"
            echo "Workflows:      $(mark "${WORKFLOW}")"
            echo "Documentation:  $(mark "${DOCS}")"
            echo ""
            echo "Deployment decision:"
            echo "${decision}"
            echo '```'
            echo ""
            echo "Next stage: security and quality."
            if [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "schedule" ]; then
              echo "This run does not deploy to the Bluehost VPS."
            elif [ "${DEPLOY}" = "true" ]; then
              echo "Bluehost VPS deployment is stage 4, after security and validation."
            else
              echo "Bluehost VPS deployment will be skipped. Frontend publishing stays on Vercel."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Deployment decision: ${decision}"

  security-scan:
    name: "Stage 2 • Security & quality"
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Scan for tracked secrets
        run: bash .github/scripts/zynd-secret-scan.sh

      - name: Validate workflow files
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check pyyaml
          python3 .github/scripts/zynd-validate-workflows.py

      - name: Compile backend Python
        run: python3 -m compileall -q Backend/app Backend/alembic

      - name: Audit Python requirements
        id: pip_audit
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check pip-audit
          python3 -m pip_audit -r Backend/requirements.txt

      - name: Audit npm lockfile
        id: npm_audit
        continue-on-error: true
        run: npm audit --package-lock-only --audit-level=high

      - name: Publish security summary
        if: always()
        env:
          PIP_AUDIT: ${{ steps.pip_audit.outcome }}
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
        run: |
          set -euo pipefail
          {
            echo "# Stage 2 • Security and quality"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Tracked secret scan | completed in this job |"
            echo "| Workflow syntax | completed in this job |"
            echo "| Backend compileall | completed in this job |"
            echo "| pip-audit | ${PIP_AUDIT} |"
            echo "| npm audit | ${NPM_AUDIT} |"
            echo ""
            echo "Dependency audits are reported and do not fail the branch by themselves."
            echo "Secret values are not included in this summary."
          } >> "${GITHUB_STEP_SUMMARY}"

  validate-changes:
    name: "Stage 3 • Validate changed areas"
    needs:
      - detect-changes
      - security-scan
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.security-scan.result == 'success' &&
      (
        needs.detect-changes.outputs.backend_changed == 'true' ||
        needs.detect-changes.outputs.web_changed == 'true' ||
        needs.detect-changes.outputs.admin_changed == 'true' ||
        needs.detect-changes.outputs.distributor_changed == 'true' ||
        needs.detect-changes.outputs.support_changed == 'true' ||
        needs.detect-changes.outputs.shared_changed == 'true' ||
        needs.detect-changes.outputs.infrastructure_changed == 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Compile backend Python
        if: needs.detect-changes.outputs.backend_changed == 'true'
        run: python3 -m compileall -q Backend/app Backend/alembic

      - name: Validate Compose service map
        if: needs.detect-changes.outputs.infrastructure_changed == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check pyyaml
          python3 .github/scripts/zynd-validate-compose.py

      - name: Setup Node
        if: >-
          needs.detect-changes.outputs.web_changed == 'true' ||
          needs.detect-changes.outputs.admin_changed == 'true' ||
          needs.detect-changes.outputs.distributor_changed == 'true' ||
          needs.detect-changes.outputs.support_changed == 'true' ||
          needs.detect-changes.outputs.shared_changed == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        if: >-
          needs.detect-changes.outputs.web_changed == 'true' ||
          needs.detect-changes.outputs.admin_changed == 'true' ||
          needs.detect-changes.outputs.distributor_changed == 'true' ||
          needs.detect-changes.outputs.support_changed == 'true' ||
          needs.detect-changes.outputs.shared_changed == 'true'
        run: npm ci

      - name: Typecheck customer web
        if: needs.detect-changes.outputs.web_changed == 'true' || needs.detect-changes.outputs.shared_changed == 'true'
        run: npm exec --workspace zynd-web -- tsc --noEmit --pretty false

      - name: Typecheck admin
        if: needs.detect-changes.outputs.admin_changed == 'true' || needs.detect-changes.outputs.shared_changed == 'true'
        run: npm exec --workspace zynd-admin -- tsc --noEmit --pretty false

      - name: Typecheck Mitra
        if: needs.detect-changes.outputs.distributor_changed == 'true' || needs.detect-changes.outputs.shared_changed == 'true'
        run: npm exec --workspace zynd-distributor -- tsc --noEmit --pretty false

      - name: Typecheck support
        if: needs.detect-changes.outputs.support_changed == 'true' || needs.detect-changes.outputs.shared_changed == 'true'
        run: npm exec --workspace zynd-support -- tsc --noEmit --pretty false

      - name: Publish validation summary
        run: |
          {
            echo "# Stage 3 • Validate changed areas"
            echo ""
            echo "Checked only the areas marked changed in stage 1."
            echo "This stage does not deploy."
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-backend:
    name: "Stage 4 • Backend deployment"
    needs:
      - detect-changes
      - security-scan
      - validate-changes
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.detect-changes.result == 'success' && needs.security-scan.result == 'success' && (needs.validate-changes.result == 'success' || needs.validate-changes.result == 'skipped') && needs.detect-changes.outputs.deploy_backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BLUEHOST_HOST: 50.6.205.51
      BLUEHOST_USER: root
      # drone-ssh negotiates the server's ECDSA host key, so the ED25519 fingerprint never matches.
      BLUEHOST_HOST_FINGERPRINT: SHA256:hCKPABfkojXf2K9g9rIwugDS53zFSajJCDbGoYONEM8

    steps:
      - name: Deploy backend on Bluehost VPS
        id: deploy
        env:
          ZYND_STRICT_PRODUCTION: ${{ vars.ZYND_STRICT_PRODUCTION }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.BLUEHOST_HOST }}
          username: ${{ env.BLUEHOST_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ env.BLUEHOST_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 25m
          envs: ZYND_STRICT_PRODUCTION
          script: |
            set -euo pipefail

            DEPLOY_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            SECONDS=0
            PREVIOUS_COMMIT=""
            DEPLOY_COMMIT=""
            APP_ENV_VALUE="unknown"
            DEBUG_VALUE="unknown"
            DEV_OTP_STATE="unknown"
            DEV_SKIP_VALUE="unknown"
            SUMMARY_FILE="/tmp/zynd-deploy-summary.env"
            COMPOSE_FILES=(-f docker-compose.yml -f docker-compose.prod.yml)

            compose() {
              docker compose "${COMPOSE_FILES[@]}" "$@"
            }

            section() {
              echo ""
              echo "========================================"
              echo "$1"
              echo "========================================"
              echo "::group::$1"
            }

            end_section() {
              echo "::endgroup::"
            }

            write_summary() {
              local status="$1"
              umask 077
              {
                printf 'status=%s\n' "${status}"
                printf 'previous_commit=%s\n' "${PREVIOUS_COMMIT}"
                printf 'deploy_commit=%s\n' "${DEPLOY_COMMIT}"
                printf 'hostname=%s\n' "$(hostname)"
                printf 'started_at=%s\n' "${DEPLOY_STARTED_AT}"
                printf 'duration_seconds=%s\n' "${SECONDS}"
                printf 'app_env=%s\n' "${APP_ENV_VALUE}"
                printf 'debug=%s\n' "${DEBUG_VALUE}"
                printf 'dev_otp=%s\n' "${DEV_OTP_STATE}"
                printf 'dev_skip_rate_limits=%s\n' "${DEV_SKIP_VALUE}"
                printf 'strict_production=%s\n' "${ZYND_STRICT_PRODUCTION:-false}"
                printf 'api_url=%s\n' "https://api.zynd.shop"
              } > "${SUMMARY_FILE}"
              chmod 600 "${SUMMARY_FILE}"
            }

            diagnostics() {
              echo "::group::Failure diagnostics"
              echo "Previous commit: ${PREVIOUS_COMMIT:-unknown}"
              echo "Failed deployment commit: ${DEPLOY_COMMIT:-unknown}"
              echo "Potential rollback, not executed:"
              echo "  cd /opt/zynd"
              echo "  git reset --hard ${PREVIOUS_COMMIT:-<previous>}"
              echo "  docker compose -f docker-compose.yml -f docker-compose.prod.yml build api"
              echo "  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --force-recreate api"
              df -h / || true
              docker system df || true
              if [ -f docker-compose.yml ] && [ -f docker-compose.prod.yml ]; then
                compose ps || true
                compose logs --tail 150 api || true
              fi
              docker logs --tail 150 zynd-api-1 || true
              timeout 5 docker events --since 15m --until "$(date --iso-8601=seconds)" || true
              echo "::endgroup::"
            }

            on_exit() {
              local code=$?
              trap - EXIT
              if [ "${code}" -ne 0 ]; then
                diagnostics || true
                write_summary failed || true
              fi
              exit "${code}"
            }
            trap on_exit EXIT

            cd /opt/zynd
            PREVIOUS_COMMIT="$(git rev-parse --short HEAD)"

            section "[1/15] Validate Bluehost VPS"
            echo "Deployment started: ${DEPLOY_STARTED_AT}"
            echo "Repository: harshitkushwahh/Zynd"
            echo "Branch: main"
            echo "Server hostname: $(hostname)"
            echo "Current commit before deployment: ${PREVIOUS_COMMIT}"

            if [ "$(whoami)" != "root" ]; then
              echo "ERROR: SSH user is '$(whoami)', expected root."
              exit 1
            fi
            if [ "$(pwd)" != "/opt/zynd" ] || [ ! -d /opt/zynd/.git ]; then
              echo "ERROR: /opt/zynd is not the Git checkout."
              exit 1
            fi
            for cmd in git docker curl stat awk; do
              if ! command -v "${cmd}" >/dev/null 2>&1; then
                echo "ERROR: required command not found: ${cmd}"
                exit 1
              fi
            done
            if ! docker compose version >/dev/null 2>&1; then
              echo "ERROR: docker compose is not available."
              exit 1
            fi

            disk_used="$(df -P / | awk 'NR==2 {gsub("%","",$5); print $5}')"
            echo "Root filesystem use: ${disk_used}%"
            df -h /
            if [ "${disk_used}" -ge 85 ]; then
              echo "ERROR: disk use ${disk_used}% is at or above 85%. Deployment stopped before changing the server."
              exit 1
            fi
            end_section

            section "[2/15] Validate Git repository"
            fetch_log="$(mktemp)"
            if ! git fetch --quiet origin main >"${fetch_log}" 2>&1; then
              sed -E 's#(https?://)[^[:space:]@]+@#\1***@#g' "${fetch_log}" >&2 || true
              rm -f "${fetch_log}"
              echo "ERROR: git fetch origin main failed."
              exit 1
            fi
            rm -f "${fetch_log}"
            DEPLOY_COMMIT="$(git rev-parse --short origin/main)"
            echo "DEPLOY_COMMIT=${DEPLOY_COMMIT}"
            git reset --hard origin/main
            echo "Target commit after fetch: $(git rev-parse --short HEAD)"

            tracked_drift="$(git status --porcelain | grep -v '^??' || true)"
            if [ -n "${tracked_drift}" ]; then
              echo "ERROR: tracked files differ from origin/main after reset."
              printf '%s\n' "${tracked_drift}"
              exit 1
            fi
            while IFS= read -r line; do
              [ -z "${line}" ] && continue
              path="${line:3}"
              case "${path}" in
                Backend/.env|docker-compose.prod.yml|Backend/privateKey.pem|Backend/publicKey.pem|privateKey.pem|publicKey.pem)
                  echo "Keeping server-side file: ${path}"
                  ;;
                *)
                  echo "WARNING: untracked server file left in place: ${path}"
                  ;;
              esac
            done < <(git status --porcelain)
            end_section

            section "[3/15] Check server environment file"
            env_file="/opt/zynd/Backend/.env"
            if [ ! -f "${env_file}" ] || [ ! -s "${env_file}" ]; then
              echo "ERROR: Backend/.env is missing or empty on the server."
              exit 1
            fi
            env_owner="$(stat -c '%U' "${env_file}")"
            env_group="$(stat -c '%G' "${env_file}")"
            env_mode="$(stat -c '%a' "${env_file}")"
            echo "Backend/.env owner=${env_owner} group=${env_group} mode=${env_mode} bytes=$(stat -c '%s' "${env_file}")"
            if [ "${env_owner}" != "root" ] || [ "${env_group}" != "root" ] || [ "${env_mode}" != "600" ]; then
              echo "ERROR: Backend/.env must be owned by root:root with mode 600."
              exit 1
            fi
            end_section

            section "[4/15] Validate environment"
            require_env() {
              local key="$1"
              local line value
              line="$(grep -E "^${key}=" "${env_file}" | tail -n 1 || true)"
              if [ -z "${line}" ]; then
                echo "ERROR: required variable is missing: ${key}"
                return 1
              fi
              value="${line#*=}"
              value="${value#"${value%%[![:space:]]*}"}"
              value="${value%"${value##*[![:space:]]}"}"
              value="${value#\"}"
              value="${value%\"}"
              value="${value#\'}"
              value="${value%\'}"
              if [ -z "${value}" ]; then
                echo "ERROR: required variable is empty: ${key}"
                return 1
              fi
              echo "present: ${key}"
            }

            env_missing=0
            for key in APP_ENV DEBUG DATABASE_URL REDIS_URL SECRET_KEY CORS_ORIGINS FRONTEND_URL API_PUBLIC_URL; do
              require_env "${key}" || env_missing=1
            done
            if ! grep -Eq '^(MONGO_CONN|MONGO_URL)=' "${env_file}"; then
              echo "ERROR: required variable is missing: MONGO_CONN or MONGO_URL"
              env_missing=1
            else
              echo "present: MONGO_CONN or MONGO_URL"
            fi
            if [ "${env_missing}" -ne 0 ]; then
              exit 1
            fi

            env_value() {
              local key="$1"
              local line value
              line="$(grep -E "^${key}=" "${env_file}" | tail -n 1 || true)"
              value="${line#*=}"
              value="${value#"${value%%[![:space:]]*}"}"
              value="${value%"${value##*[![:space:]]}"}"
              value="${value#\"}"
              value="${value%\"}"
              value="${value#\'}"
              value="${value%\'}"
              printf '%s' "${value}"
            }

            APP_ENV_VALUE="$(env_value APP_ENV)"
            DEBUG_VALUE="$(env_value DEBUG)"
            DEV_SKIP_VALUE="$(env_value DEV_SKIP_RATE_LIMITS)"
            if [ -n "$(env_value DEV_OTP)" ]; then
              DEV_OTP_STATE="set"
            else
              DEV_OTP_STATE="unset"
            fi
            echo "APP_ENV=${APP_ENV_VALUE}"
            echo "DEBUG=${DEBUG_VALUE}"
            echo "DEV_OTP=${DEV_OTP_STATE}"
            echo "DEV_SKIP_RATE_LIMITS=${DEV_SKIP_VALUE:-unset}"

            dev_runtime=0
            if [ "${APP_ENV_VALUE}" != "production" ] || [ "${DEBUG_VALUE}" = "true" ] || [ "${DEV_OTP_STATE}" = "set" ] || [ "${DEV_SKIP_VALUE}" = "true" ]; then
              dev_runtime=1
            fi
            if [ "${dev_runtime}" -eq 1 ]; then
              echo "WARNING: development runtime flags are enabled on this VM."
              echo "This is expected for the current testing server and is not a customer-production gate unless ZYND_STRICT_PRODUCTION=true."
              if [ "${ZYND_STRICT_PRODUCTION:-false}" = "true" ]; then
                echo "ERROR: ZYND_STRICT_PRODUCTION=true and development runtime flags are enabled."
                exit 1
              fi
            else
              echo "Runtime configuration is production."
            fi
            end_section

            section "[5/15] Validate Docker"
            docker version
            docker compose version
            compose config -q
            echo "Compose configuration is valid."
            docker system df
            end_section

            section "[6/15] Check infrastructure"
            mapfile -t compose_services < <(compose config --services)
            require_service() {
              local name="$1"
              local existing
              for existing in "${compose_services[@]}"; do
                if [ "${existing}" = "${name}" ]; then
                  return 0
                fi
              done
              echo "ERROR: compose service not found: ${name}"
              printf 'Configured services: %s\n' "${compose_services[*]}"
              return 1
            }
            service_state() {
              local cid
              cid="$(compose ps -q "$1" || true)"
              if [ -z "${cid}" ]; then
                echo "missing"
                return 0
              fi
              docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${cid}"
            }
            infra_failed=0
            for svc in postgres redis clamav minio; do
              require_service "${svc}" || infra_failed=1
            done
            if printf '%s\n' "${compose_services[@]}" | grep -qx mongo; then
              MONGO_SERVICE="mongo"
            elif printf '%s\n' "${compose_services[@]}" | grep -qx mongodb; then
              MONGO_SERVICE="mongodb"
            else
              echo "ERROR: compose service not found: mongo"
              printf 'Configured services: %s\n' "${compose_services[*]}"
              infra_failed=1
              MONGO_SERVICE=""
            fi
            require_service api || infra_failed=1
            if [ "${infra_failed}" -ne 0 ]; then
              exit 1
            fi
            for svc in postgres "${MONGO_SERVICE}" redis clamav minio; do
              state="$(service_state "${svc}")"
              echo "${svc}: ${state}"
              case "${state}" in
                running|healthy) ;;
                *)
                  echo "ERROR: ${svc} is ${state}. API was not recreated."
                  exit 1
                  ;;
              esac
            done
            echo "api before deploy: $(service_state api)"
            echo "Infrastructure containers were not restarted."
            end_section

            section "[7/15] Build API"
            compose build api
            end_section

            section "[8/15] Deploy API and backend workers"
            compose up -d --no-deps --force-recreate api
            echo "api recreated. Infrastructure dependencies were left running."

            # Background workers run the same Backend image as the API. If they are
            # not recreated here they keep running the previous build forever
            # (the MF scheduler was stuck on stale code this way).
            worker_services=""
            skip_scheduler=0
            if printf '%s\n' "${compose_services[@]}" | grep -qx mf-scheduler; then
              set +e
              scheduler_guard="$(compose exec -T api python -m app.jobs.check_mf_worker_recreate 2>/dev/null)"
              guard_code=$?
              set -e
              printf '%s\n' "${scheduler_guard}"
              if [ "${guard_code}" -eq 10 ] || [ "${guard_code}" -ne 0 ]; then
                skip_scheduler=1
                echo "Leaving mf-scheduler running so a live ingestion or pipeline is not killed."
              fi
            fi
            for worker in mf-scheduler nfo-scheduler mf-order-worker mf-cas-worker event-worker outbox-relay document-scan-worker deletion-cron; do
              if [ "${worker}" = "mf-scheduler" ] && [ "${skip_scheduler}" -eq 1 ]; then
                echo "mf-scheduler: skipped (live work)"
                continue
              fi
              if printf '%s\n' "${compose_services[@]}" | grep -qx "${worker}"; then
                worker_services="${worker_services} ${worker}"
              fi
            done
            if [ -n "${worker_services}" ]; then
              echo "Recreating backend workers:${worker_services}"
              # shellcheck disable=SC2086
              compose up -d --no-deps --force-recreate ${worker_services}
              for worker in ${worker_services}; do
                echo "${worker}: $(service_state "${worker}")"
              done
            else
              echo "No backend worker services defined in compose; skipping."
            fi
            if [ "${skip_scheduler}" -eq 1 ]; then
              echo "mf-scheduler: $(service_state mf-scheduler) (not recreated)"
            fi
            end_section

            section "[9/15] Wait for readiness"
            wait_until() {
              local label="$1"
              shift
              local attempt
              echo "Waiting for ${label}..."
              for attempt in $(seq 1 30); do
                if "$@"; then
                  echo "${label}: ready"
                  return 0
                fi
                echo "${label} not ready yet (${attempt}/30)"
                sleep 2
              done
              echo "ERROR: ${label} was not ready within 60 seconds."
              return 1
            }

            redis_ready() {
              local output
              output="$(compose exec -T redis redis-cli ping 2>&1 || true)"
              if printf '%s' "${output}" | grep -q PONG; then
                return 0
              fi
              if printf '%s' "${output}" | grep -q NOAUTH; then
                local state
                state="$(service_state redis)"
                [ "${state}" = "running" ] || [ "${state}" = "healthy" ]
                return
              fi
              return 1
            }

            mongo_ready() {
              local state
              state="$(service_state "${MONGO_SERVICE}")"
              [ "${state}" = "healthy" ] || [ "${state}" = "running" ]
            }

            api_container_ready() {
              local state
              state="$(service_state api)"
              [ "${state}" = "healthy" ] || [ "${state}" = "running" ]
            }

            wait_until "PostgreSQL" compose exec -T postgres pg_isready -U zynd -d zynd
            wait_until "Redis" redis_ready
            wait_until "MongoDB" mongo_ready
            wait_until "API container" api_container_ready
            end_section

            section "[10/15] Local API health"
            local_body=""
            local_ok=0
            for attempt in $(seq 1 30); do
              if local_body="$(curl -fsS http://127.0.0.1:8000/)"; then
                if printf '%s' "${local_body}" | grep -q 'ZYND API'; then
                  local_ok=1
                  break
                fi
              fi
              echo "Local API not ready yet (${attempt}/30)"
              sleep 2
            done
            if [ "${local_ok}" -ne 1 ]; then
              echo "ERROR: http://127.0.0.1:8000/ did not return ZYND API."
              exit 1
            fi
            echo "Local API health: OK"
            printf '%s\n' "${local_body}"
            end_section

            section "[11/15] API functional health"
            health_body="$(curl -fsS http://127.0.0.1:8000/api/v1/health)"
            printf '%s\n' "${health_body}"
            if ! printf '%s' "${health_body}" | grep -q '"status"' || ! printf '%s' "${health_body}" | grep -q 'ok' || ! printf '%s' "${health_body}" | grep -q 'ZYND API'; then
              echo "ERROR: /api/v1/health did not report the ZYND API as ok."
              exit 1
            fi
            redis_body="$(curl -fsS http://127.0.0.1:8000/api/v1/health/redis)"
            printf '%s\n' "${redis_body}"
            if ! printf '%s' "${redis_body}" | grep -q '"status":"ok"' && ! printf '%s' "${redis_body}" | grep -q '"status": "ok"'; then
              echo "ERROR: /api/v1/health/redis did not report ok."
              exit 1
            fi
            api_cid="$(compose ps -q api)"
            api_status="$(docker inspect -f '{{.State.Status}}' "${api_cid}")"
            if [ "${api_status}" != "running" ]; then
              echo "ERROR: API container status is ${api_status}."
              exit 1
            fi
            echo "Functional API check: OK"
            end_section

            section "[12/15] HTTPS check"
            https_body="$(curl -fsS https://api.zynd.shop/)"
            printf '%s\n' "${https_body}"
            if ! printf '%s' "${https_body}" | grep -q 'ZYND API'; then
              echo "ERROR: https://api.zynd.shop/ did not return ZYND API."
              exit 1
            fi
            echo "HTTPS check: OK"
            end_section

            section "[13/15] CORS check"
            cors_headers="$(curl -sS -D - -o /dev/null -X OPTIONS https://api.zynd.shop/api/v1/health -H 'Origin: https://zynd.shop' -H 'Access-Control-Request-Method: GET')"
            allow_origin="$(printf '%s\n' "${cors_headers}" | awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {print $2}' | tr -d '\r')"
            echo "Access-Control-Allow-Origin: ${allow_origin:-missing}"
            if [ "${allow_origin}" != "https://zynd.shop" ] && [ "${allow_origin}" != "*" ]; then
              echo "ERROR: customer origin https://zynd.shop is not allowed by CORS."
              exit 1
            fi
            echo "CORS check: OK"
            end_section

            section "[14/15] Stability check"
            echo "Waiting 8 seconds for an immediate crash to show up..."
            sleep 8
            api_cid="$(compose ps -q api)"
            api_status="$(docker inspect -f '{{.State.Status}}' "${api_cid}")"
            api_restarts="$(docker inspect -f '{{.RestartCount}}' "${api_cid}")"
            echo "API status=${api_status} restart_count=${api_restarts}"
            compose ps
            if [ "${api_status}" != "running" ] || [ "${api_restarts}" -ne 0 ]; then
              echo "ERROR: API is not stable after deployment."
              exit 1
            fi
            workers_unstable=0
            for worker in ${worker_services}; do
              worker_cid="$(compose ps -q "${worker}" || true)"
              if [ -z "${worker_cid}" ]; then
                echo "ERROR: ${worker} container is missing after deployment."
                workers_unstable=1
                continue
              fi
              worker_status="$(docker inspect -f '{{.State.Status}}' "${worker_cid}")"
              worker_restarts="$(docker inspect -f '{{.RestartCount}}' "${worker_cid}")"
              echo "${worker} status=${worker_status} restart_count=${worker_restarts}"
              if [ "${worker_status}" != "running" ] || [ "${worker_restarts}" -ne 0 ]; then
                echo "ERROR: ${worker} is not stable after deployment."
                compose logs --tail 60 "${worker}" || true
                workers_unstable=1
              fi
            done
            if [ "${workers_unstable}" -ne 0 ]; then
              exit 1
            fi
            if printf '%s' "${worker_services}" | grep -q mf-scheduler; then
              echo "MF scheduler startup log:"
              compose logs --tail 40 mf-scheduler | grep -E "MF scheduler (started|job=)" || true
            fi
            echo "Container stability: OK"
            end_section

            section "[15/15] Deployment summary"
            echo "========================================"
            echo "ZYND BACKEND DEPLOYMENT SUCCESSFUL"
            echo "========================================"
            echo "Environment: ${APP_ENV_VALUE}"
            echo "Branch: main"
            echo "Commit: ${DEPLOY_COMMIT}"
            echo "Previous Commit: ${PREVIOUS_COMMIT}"
            echo "Server: $(hostname)"
            echo "API: https://api.zynd.shop"
            echo "Local API: http://127.0.0.1:8000"
            echo "Checks:"
            echo "  Git repository"
            echo "  Environment"
            echo "  Docker"
            echo "  Compose"
            echo "  PostgreSQL"
            echo "  MongoDB"
            echo "  Redis"
            echo "  API container"
            echo "  API health"
            echo "  API functional check"
            echo "  HTTPS"
            echo "  CORS"
            echo "  Container stability"
            echo "Deployment duration: ${SECONDS} seconds"
            echo "Alembic was not run by this workflow."
            write_summary success
            end_section

      - name: Read deployment report
        id: report
        if: always()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.BLUEHOST_HOST }}
          username: ${{ env.BLUEHOST_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ env.BLUEHOST_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 1m
          capture_stdout: "true"
          script: |
            if [ -f /tmp/zynd-deploy-summary.env ]; then
              cat /tmp/zynd-deploy-summary.env
            else
              echo "status=unknown"
            fi

      - name: Publish GitHub deployment summary
        if: always()
        env:
          REPORT: ${{ steps.report.outputs.stdout }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          field() {
            printf '%s\n' "${REPORT}" | sed -n "s/^${1}=//p" | tail -n 1
          }
          status="$(field status)"
          if [ "${DEPLOY_OUTCOME}" != "success" ]; then
            status="failed"
          fi
          status_label="FAILED"
          if [ "${status}" = "success" ]; then
            status_label="SUCCESS"
          fi
          {
            echo "# ZYND Backend Deployment"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Branch | main |"
            echo "| Commit | $(field deploy_commit) |"
            echo "| Previous commit | $(field previous_commit) |"
            echo "| Server | $(field hostname) |"
            echo "| Runtime | $(field app_env) |"
            echo "| API | https://api.zynd.shop |"
            echo "| Status | ${status_label} |"
            echo "| Duration | $(field duration_seconds)s |"
            echo ""
            if [ "${status_label}" = "SUCCESS" ]; then
              echo "Checks:"
              echo ""
              echo "- ✅ Git validation"
              echo "- ✅ Environment validation"
              echo "- ✅ Docker validation"
              echo "- ✅ Compose validation"
              echo "- ✅ PostgreSQL"
              echo "- ✅ MongoDB"
              echo "- ✅ Redis"
              echo "- ✅ API container"
              echo "- ✅ API health"
              echo "- ✅ API functional health"
              echo "- ✅ HTTPS"
              echo "- ✅ CORS"
              echo "- ✅ Stability"
            else
              echo "The deployment stopped before every check could pass. Diagnostics are in the deploy log."
            fi
            echo ""
            echo "Alembic is not executed by this workflow. A development API still applies pending migrations itself during startup."
          } >> "${GITHUB_STEP_SUMMARY}"

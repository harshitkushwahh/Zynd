# Validates the areas changed by a pull request. This workflow never deploys.
name: ZYND • Pull Request Validation

"on":
  pull_request:
    branches:
      - main

concurrency:
  group: zynd-pr-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      web_changed: ${{ steps.classify.outputs.web_changed }}
      admin_changed: ${{ steps.classify.outputs.admin_changed }}
      distributor_changed: ${{ steps.classify.outputs.distributor_changed }}
      support_changed: ${{ steps.classify.outputs.support_changed }}
      shared_changed: ${{ steps.classify.outputs.shared_changed }}
      infrastructure_changed: ${{ steps.classify.outputs.infrastructure_changed }}
      documentation_changed: ${{ steps.classify.outputs.documentation_changed }}
      deploy_backend: ${{ steps.classify.outputs.deploy_backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Classify pull request paths
        id: classify
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP}/zynd-changed.txt"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "${list}"
          bash .github/scripts/zynd-classify-changes.sh "${list}" >> "${GITHUB_OUTPUT}"

  validate-backend:
    name: validate-backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Compile backend Python
        run: python3 -m compileall -q Backend/app Backend/alembic

      - name: Publish backend summary
        run: |
          {
            echo "# ZYND backend validation"
            echo ""
            echo "Python compile completed for Backend/app and Backend/alembic."
            echo "This job does not deploy and does not install production secrets."
          } >> "${GITHUB_STEP_SUMMARY}"

  validate-infrastructure:
    name: validate-infrastructure
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate Compose service map
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check pyyaml
          python3 .github/scripts/zynd-validate-compose.py

      - name: Publish infrastructure summary
        run: |
          {
            echo "# ZYND infrastructure validation"
            echo ""
            echo "Checked docker-compose.yml for postgres, redis, minio, and clamav."
            echo "docker-compose.prod.yml stays on the Azure VM and is not in git."
          } >> "${GITHUB_STEP_SUMMARY}"

  validate-web:
    name: validate-web
    needs: detect-changes
    if: needs.detect-changes.outputs.web_changed == 'true' || needs.detect-changes.outputs.shared_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Typecheck customer web
        run: npm exec --workspace zynd-web -- tsc --noEmit --pretty false

      - name: Publish web summary
        run: |
          {
            echo "# ZYND customer web validation"
            echo ""
            echo "Typecheck completed for zynd-web. Vercel remains the publisher."
          } >> "${GITHUB_STEP_SUMMARY}"

  validate-admin:
    name: validate-admin
    needs: detect-changes
    if: needs.detect-changes.outputs.admin_changed == 'true' || needs.detect-changes.outputs.shared_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Typecheck admin
        run: npm exec --workspace zynd-admin -- tsc --noEmit --pretty false

      - name: Publish admin summary
        run: |
          {
            echo "# ZYND admin validation"
            echo ""
            echo "Typecheck completed for zynd-admin. Vercel remains the publisher."
          } >> "${GITHUB_STEP_SUMMARY}"

  validate-distributor:
    name: validate-distributor
    needs: detect-changes
    if: needs.detect-changes.outputs.distributor_changed == 'true' || needs.detect-changes.outputs.shared_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Typecheck Mitra
        run: npm exec --workspace zynd-distributor -- tsc --noEmit --pretty false

      - name: Publish distributor summary
        run: |
          {
            echo "# ZYND Mitra validation"
            echo ""
            echo "Typecheck completed for zynd-distributor. Vercel remains the publisher."
          } >> "${GITHUB_STEP_SUMMARY}"

  validate-support:
    name: validate-support
    needs: detect-changes
    if: needs.detect-changes.outputs.support_changed == 'true' || needs.detect-changes.outputs.shared_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Typecheck support
        run: npm exec --workspace zynd-support -- tsc --noEmit --pretty false

      - name: Publish support summary
        run: |
          {
            echo "# ZYND support validation"
            echo ""
            echo "Typecheck completed for zynd-support."
          } >> "${GITHUB_STEP_SUMMARY}"

  validation-summary:
    name: validation-summary
    needs:
      - detect-changes
      - validate-backend
      - validate-infrastructure
      - validate-web
      - validate-admin
      - validate-distributor
      - validate-support
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish pull request summary
        env:
          BACKEND: ${{ needs.validate-backend.result }}
          INFRA: ${{ needs.validate-infrastructure.result }}
          WEB: ${{ needs.validate-web.result }}
          ADMIN: ${{ needs.validate-admin.result }}
          DISTRIBUTOR: ${{ needs.validate-distributor.result }}
          SUPPORT: ${{ needs.validate-support.result }}
          DOCS: ${{ needs.detect-changes.outputs.documentation_changed }}
          DEPLOY: ${{ needs.detect-changes.outputs.deploy_backend }}
        run: |
          set -euo pipefail
          {
            echo "# ZYND pull request validation"
            echo ""
            echo "| Area | Result |"
            echo "|------|--------|"
            echo "| Backend | ${BACKEND} |"
            echo "| Infrastructure | ${INFRA} |"
            echo "| Customer web | ${WEB} |"
            echo "| Admin | ${ADMIN} |"
            echo "| Mitra | ${DISTRIBUTOR} |"
            echo "| Support | ${SUPPORT} |"
            echo ""
            echo "Documentation changed: ${DOCS}"
            echo ""
            echo "Azure deployment from this pull request: no"
            echo "Same paths pushed to main would require backend deployment: ${DEPLOY}"
          } >> "${GITHUB_STEP_SUMMARY}"

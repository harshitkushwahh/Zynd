# Redis configuration mounted into the docker-compose "redis" service.
#
# Default connection (used across Backend, Web, Admin .env files):
#   REDIS_URL=redis://localhost:6379/0   (host)   /  redis://redis:6379/0 (containers)
#
# Backend DB allocation:
#   DB 0 — default / general (realtime pub/sub, health)
#   DB 1 — sessions  (REDIS_SESSION_DB)
#   DB 2 — cache     (REDIS_CACHE_DB)
#   DB 3 — events    (REDIS_EVENT_STREAM_DB, Redis Streams)
#   DB 4 — worker queues (REDIS_DOCUMENT_WORKER_DB: document scan + push dispatch)
#
# Inside Docker this process must listen on the container's network interface,
# otherwise the api/worker containers cannot reach it. Exposure to the outside
# world is controlled by the compose port mapping (127.0.0.1:6379:6379), not here.
bind 0.0.0.0
port 6379
databases 16

# Never drop idle or blocked clients server-side. Workers hold BRPOP / XREADGROUP
# connections open; the application bounds those waits itself.
timeout 0
tcp-keepalive 300

# Streams and queues must survive a container restart.
appendonly yes
appendfsync everysec

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zynd
      POSTGRES_PASSWORD: zynd
      POSTGRES_DB: zynd
    ports:
      # Loopback only. Docker port maps bypass the host firewall, so a bare
      # "5432:5432" would expose the database to the internet on a VPS.
      - "127.0.0.1:5432:5432"
    volumes:
      - zynd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zynd -d zynd"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./Redis/redis.local.conf:/usr/local/etc/redis/redis.conf:ro
      - zynd_redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  deletion-cron:
    build:
      context: ./Backend
    command: python -m app.jobs.run_deletion_scheduler --schedule
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zynd:zynd@postgres:5432/zynd
      REDIS_URL: redis://redis:6379/0
      DELETION_EXECUTOR_INTERVAL_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zynd
      MINIO_ROOT_PASSWORD: zyndsecret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - zynd_minio_data:/data
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 25M
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  document-scan-worker:
    build:
      context: ./Backend
    command: python -m app.jobs.run_document_scan_worker
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zynd:zynd@postgres:5432/zynd
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_SCAN_DISPATCH_MODE: async
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped

  event-worker:
    build:
      context: ./Backend
    command: python -m app.jobs.run_event_worker
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zynd:zynd@postgres:5432/zynd
      REDIS_URL: redis://redis:6379/0
      EVENT_USE_WORKER_IN_DEV: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  outbox-relay:
    build:
      context: ./Backend
    command: python -m app.jobs.run_outbox_relay
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zynd:zynd@postgres:5432/zynd
      REDIS_URL: redis://redis:6379/0
      EVENT_USE_WORKER_IN_DEV: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mf-scheduler:
    build:
      context: ./Backend
    command: python -m app.jobs.run_mf_scheduler --schedule
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zynd:zynd@postgres:5432/zynd
      REDIS_URL: redis://redis:6379/0
      ZYND_MF_INGESTION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  nfo-scheduler:
    build:
      context: ./Backend
    command: python -m app.jobs.run_nfo_scheduler --schedule
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zynd:zynd@postgres:5432/zynd
      REDIS_URL: redis://redis:6379/0
      ZYND_NFO_INGESTION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mf-order-worker:
    build:
      context: ./Backend
    command: python -m app.jobs.run_mf_transaction_workers --orders
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zynd:zynd@postgres:5432/zynd
      REDIS_URL: redis://redis:6379/0
      ZYND_MF_ORDERS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mf-cas-worker:
    build:
      context: ./Backend
    command: python -m app.jobs.run_mf_transaction_workers --cas
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zynd:zynd@postgres:5432/zynd
      REDIS_URL: redis://redis:6379/0
      ZYND_MF_CAS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zynd_pg_data:
  zynd_redis_data:
  zynd_minio_data:
